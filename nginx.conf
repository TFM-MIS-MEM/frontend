server {
  listen 80;
  root /usr/share/nginx/html;

  # Aplicación de una sola página: cualquier ruta del panel (/galleries/…)
  # sirve index.html y la resuelve el enrutador del navegador.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
